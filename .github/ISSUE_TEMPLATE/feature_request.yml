name: Feature request
description: Suggest an idea or improvement for Ferronote
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the [roadmap](https://github.com/tareqmy/ferronote/blob/master/ROADMAP.md) and existing issues first; your idea may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow or pain point, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work? Keybindings, CLI flags, or config options are all useful details.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'm willing to open a pull request for this
