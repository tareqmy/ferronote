[package]
name = "ferronote"
version = "0.1.0"
edition = "2024"
authors = ["Tareq M Y"]
description = "A blazing-fast terminal note-taking app inspired by Notational Velocity"
license = "MIT"
readme = "README.md"
repository = "https://github.com/tareqmy/ferronote"
keywords = ["tui", "notes", "notational-velocity", "terminal", "productivity"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
color-eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
fuzzy-matcher = "0.3"
tui-textarea = "0.7"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
