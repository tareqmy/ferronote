name: Rust CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Toolchain
        # Installs the version pinned in rust-toolchain.toml (incl. components)
        run: rustup toolchain install

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Check Formatting
        run: make fmt-check

      - name: Lint (Clippy)
        run: make lint

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check licenses, sources, and advisories
        uses: EmbarkStudios/cargo-deny-action@v2

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Toolchain
        # Installs the version pinned in rust-toolchain.toml (incl. components)
        run: rustup toolchain install

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Run Tests
        run: make test
