name: CD

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    steps:
      - name: Create Draft Release
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release already exists"
          else
            gh release create "${{ github.ref_name }}" --draft --title "${{ github.ref_name }}" --notes "Release version ${{ github.ref_name }}" --repo "${{ github.repository }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    name: Upload Assets - ${{ matrix.target }}
    needs: create-release
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install musl-tools (musl target only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        # Installs the version pinned in rust-toolchain.toml, then adds the
        # cross-compilation target to that same toolchain.
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../ferronote-${{ github.ref_name }}-${{ matrix.target }}.tar.gz ferronote

      - name: Package binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../ferronote-${{ github.ref_name }}-${{ matrix.target }}.zip ferronote.exe

      - name: Upload Asset to Draft Release
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            gh release upload "${{ github.ref_name }}" "ferronote-${{ github.ref_name }}-${{ matrix.target }}.zip" --clobber --repo "${{ github.repository }}"
          else
            gh release upload "${{ github.ref_name }}" "ferronote-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" --clobber --repo "${{ github.repository }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    name: Publish Release
    needs: upload-assets
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub Release
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-cargo:
    name: Publish to Crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Token Presence
        id: check-token
        run: |
          if [ -z "${{ secrets.CARGO_REGISTRY_TOKEN }}" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN secret is not set. Skipping Crates.io publication."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Install Rust toolchain
        if: steps.check-token.outputs.skip == 'false'
        run: rustup toolchain install
      - name: Cargo Publish
        if: steps.check-token.outputs.skip == 'false'
        run: |
          cargo publish -p ferronote-search --token "${{ secrets.CARGO_REGISTRY_TOKEN }}" || echo "ferronote-search already published"
          cargo publish -p ferronote-store --token "${{ secrets.CARGO_REGISTRY_TOKEN }}" || echo "ferronote-store already published"
          cargo publish -p ferronote --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

  publish-homebrew:
    name: Publish to Homebrew Tap
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - name: Calculate Hash and Update Formula
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_NUM="${VERSION#v}"

          # Clone the tap repository manually using the token
          git clone "https://oauth2:${{ secrets.TAP_GITHUB_TOKEN }}@github.com/tareqmy/homebrew-tap.git" homebrew-tap || {
            echo "Clone failed (possibly empty repository). Initializing new local repository..."
            mkdir homebrew-tap
            cd homebrew-tap
            git init
            git checkout -b main
            git remote add origin "https://oauth2:${{ secrets.TAP_GITHUB_TOKEN }}@github.com/tareqmy/homebrew-tap.git"
            cd ..
          }

          # Fetch files to calculate sha256 checksums
          curl -LO "https://github.com/tareqmy/ferronote/releases/download/${VERSION}/ferronote-${VERSION}-x86_64-apple-darwin.tar.gz"
          curl -LO "https://github.com/tareqmy/ferronote/releases/download/${VERSION}/ferronote-${VERSION}-aarch64-apple-darwin.tar.gz"
          curl -LO "https://github.com/tareqmy/ferronote/releases/download/${VERSION}/ferronote-${VERSION}-x86_64-unknown-linux-musl.tar.gz"

          INTEL_SHA=$(sha256sum ferronote-${VERSION}-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)
          ARM_SHA=$(sha256sum ferronote-${VERSION}-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)
          LINUX_SHA=$(sha256sum ferronote-${VERSION}-x86_64-unknown-linux-musl.tar.gz | cut -d' ' -f1)

          mkdir -p homebrew-tap/Formula

          # Re-write the formula with new versions and hashes
          cat <<EOF > homebrew-tap/Formula/ferronote.rb
          class Ferronote < Formula
            desc "A blazing-fast terminal note-taking app inspired by Notational Velocity"
            homepage "https://github.com/tareqmy/ferronote"
            version "${VERSION_NUM}"

            if OS.mac?
              if Hardware::CPU.intel?
                url "https://github.com/tareqmy/ferronote/releases/download/v#{version}/ferronote-v#{version}-x86_64-apple-darwin.tar.gz"
                sha256 "${INTEL_SHA}"
              elsif Hardware::CPU.arm?
                url "https://github.com/tareqmy/ferronote/releases/download/v#{version}/ferronote-v#{version}-aarch64-apple-darwin.tar.gz"
                sha256 "${ARM_SHA}"
              end
            elsif OS.linux?
              if Hardware::CPU.intel?
                url "https://github.com/tareqmy/ferronote/releases/download/v#{version}/ferronote-v#{version}-x86_64-unknown-linux-musl.tar.gz"
                sha256 "${LINUX_SHA}"
              end
            end

            def install
              bin.install "ferronote"
              bin.install_symlink "ferronote" => "fn"
              bin.install_symlink "ferronote" => "fnt"
            end

            test do
              assert_match "ferronote", shell_output("#{bin}/ferronote --version")
            end
          end
          EOF

          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ferronote.rb
          git commit -m "Update ferronote to ${VERSION}" || echo "No changes to commit"
          git push origin main || git push origin master || echo "No changes to push"
