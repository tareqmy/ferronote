name: Ferronote Release Pipeline

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ci-quality-and-tests:
    name: Code Quality & Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --check

      - name: Run Clippy Linter
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Unit & Integration Tests
        run: cargo test --all-targets --all-features

  build-binaries:
    name: Build Binary (${{ matrix.target }})
    needs: ci-quality-and-tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-20.04
            target: x86_64-unknown-linux-gnu
            artifact_name: ferronote-linux-amd64.tar.gz
            binary_name: ferronote
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: ferronote-macos-arm64.tar.gz
            binary_name: ferronote
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ferronote-windows-amd64.zip
            binary_name: ferronote.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.artifact_name }} ${{ matrix.binary_name }}

      - name: Package Binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.artifact_name }} ${{ matrix.binary_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  publish-release:
    name: Create GitHub Release & Crates.io Publish
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Download All Binary Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          cargo package --allow-dirty
          cargo publish --token $CARGO_REGISTRY_TOKEN --allow-dirty

  publish-homebrew:
    name: Publish to Homebrew Tap
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - name: Check Token Presence
        id: check-token
        run: |
          if [ -z "${{ secrets.TAP_GITHUB_TOKEN }}" ]; then
            echo "::warning::TAP_GITHUB_TOKEN secret is not set. Skipping Homebrew publication."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Update Homebrew Formula
        if: steps.check-token.outputs.skip == 'false'
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_NUM="${VERSION#v}"

          git clone "https://oauth2:${{ secrets.TAP_GITHUB_TOKEN }}@github.com/tareqmy/homebrew-tap.git" homebrew-tap || {
            echo "Clone failed. Initializing new local repository..."
            mkdir homebrew-tap
            cd homebrew-tap
            git init
            git checkout -b main
            git remote add origin "https://oauth2:${{ secrets.TAP_GITHUB_TOKEN }}@github.com/tareqmy/homebrew-tap.git"
            cd ..
          }

          curl -LO "https://github.com/tareqmy/ferronote/archive/refs/tags/${VERSION}.tar.gz"
          SOURCE_SHA=$(sha256sum "${VERSION}.tar.gz" | cut -d' ' -f1)

          mkdir -p homebrew-tap/Formula

          cat <<EOF > homebrew-tap/Formula/ferronote.rb
          class Ferronote < Formula
            desc "Blazing-fast terminal note-taking app inspired by Notational Velocity"
            homepage "https://github.com/tareqmy/ferronote"
            url "https://github.com/tareqmy/ferronote/archive/refs/tags/${VERSION}.tar.gz"
            sha256 "${SOURCE_SHA}"
            license "MIT"

            depends_on "rust" => :build

            def install
              system "cargo", "install", *std_cargo_args
            end

            test do
              assert_match "ferronote", shell_output("#{bin}/ferronote --version")
            end
          end
          EOF

          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ferronote.rb
          git commit -m "Update ferronote to ${VERSION}" || echo "No changes to commit"
          git push origin main || git push origin master || echo "No changes to push"

