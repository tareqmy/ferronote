[workspace]
members = [
    "ferronote-store",
    "ferronote-search",
    "."
]
resolver = "2"

[package]
name = "ferronote"
version = "1.2.6"
edition = "2024"
default-run = "ferronote"
authors = ["Tareq M Y"]
description = "A blazing-fast terminal note-taking app inspired by Notational Velocity"
license = "MIT"
readme = "README.md"
repository = "https://github.com/tareqmy/ferronote"
keywords = ["tui", "notes", "notational-velocity", "terminal", "productivity"]
categories = ["command-line-utilities", "text-processing"]
exclude = [
    ".github/*",
    ".gemini/*",
    ".idea/*",
    "assets/*",
]

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
futures = "0.3"
color-eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

tui-textarea = { version = "0.7", features = ["search"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
notify = "8.2.0"
open = "5"
ferronote-store = { version = "1.2.6", path = "ferronote-store" }
ferronote-search = { version = "1.2.6", path = "ferronote-search" }

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
criterion = "0.5"
tempfile = "3.27.0"

[[bench]]
name = "search_benchmark"
harness = false
